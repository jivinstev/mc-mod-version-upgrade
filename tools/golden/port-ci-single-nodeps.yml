# Port CI: proves this unofficial port builds, loads and runs, and publishes the JAR on a version tag.
#
# Installed by tools/port-ci.py into a fork's port branch, as a commit of its own so it can be dropped if
# the port is ever offered upstream. It runs the author's own build, then the same gates the port was held
# to (mixin-config integrity, a headless server running GameTests, a real client under Xvfb) with NO model
# and no automatic fixes -- a plain pass/fail. The gate harness is not part of this repository: it comes from
# the Port CI kit, a release asset of owner/migrator holding only the gate runner and what it needs,
# pinned here by version and sha256, and is generated outside the source tree.
#
# Release: run this workflow by hand (Actions -> Port CI -> Run workflow) with release = true, or push a tag
# named <mod>-<version>-mc<minecraft>. If every gate passes, the JARs the author's build produced are published
# as a PRE-release tagged <mod>-<version>-mc<minecraft> (the version read from gradle.properties).
#
# Promote: once a person has played a pre-release, run this workflow with promote = <that tag> and played_by =
# <their GitHub login> (tools/port-ci.py promote does it). It runs no gates and builds nothing: it checks the tag
# is a pre-release this workflow published from this branch, then makes it a full Release, marked latest, and
# replaces "Pre-release until played by a person." in its notes with who played it and when. When the port branch
# carries an install manifest (.github/port-install.json), it then points that at the promoted jar and the sibling
# jars this workflow pins, in a data-only [skip ci] commit on the port branch (tools/port-manifest.py refresh).
#
# Publish: when the fork has .github/port-publish.json, a promoted Release is then uploaded to Modrinth and
# CurseForge (tools/port-publish.py, MODRINTH_TOKEN / CURSEFORGE_TOKEN repository secrets) -- in the SAME run as
# the promote, because a release edited with GITHUB_TOKEN starts no other workflow. A release promoted by hand
# in the GitHub UI publishes too, and publish = <tag> publishes one by hand. publish_setup = true creates the
# Modrinth draft project once. Publishing refuses a pre-release, a build with an open S1 in its fix ledger, and
# a dependency not yet published; it never runs on a pull request.
#
# Every pre-release carries, beside the jars, the gate summary of each environment exactly as ci-gates.py wrote it
# (gates-full.md, gates-minimal.md, gates-<env>-<variant>.md): the gate record of the commit it was built from.
#
# Reuse a run: release = true with from_run = <run id> releases the jars and gate logs of that earlier run -- a
# successful push or pull_request run of this workflow that built the same tree as this commit -- instead of building
# and gating again (no gates job runs). The release job checks the run (this repository, this workflow, completed,
# success), that its head commit and the tree its gates recorded are this commit's tree, and releases nothing otherwise.
# Each gate summary's first line then names this commit, adding the commit that was tested (a pull_request run tests
# GitHub's merge commit, in no branch's history); the rest of it is unchanged.
#
# Dependent gate: dep_override = "owner/repo@tag/asset.jar=group:artifact:version@sha256 ..." (a release asset) or
# "owner/repo#RUN_ID/ARTIFACT/asset.jar=group:artifact:version@sha256" (a jar in a workflow run's artifact) builds and
# gates against a library's candidate jar in place of the pinned one with the same group:artifact:version, on every
# gates leg and in the shipped-jar job. A run with dep_override never releases. Inputs reach scripts only through env.
name: Port CI (NeoForge 21.1.100 (Minecraft 1.21.1))

on:
  push:
    branches: ["neoforge-1.21.1"]
    tags: ["*-mc1.21.1"]
    # the known-issues ledger (tools/known-issues.py) and the root README are records, not port code: a push of only
    # those runs nothing (GitHub evaluates path filters on branch pushes only, so a release tag still runs)
    paths-ignore: [".port/KNOWN-ISSUES.json", ".port/*/KNOWN-ISSUES.json", "README.md"]
  pull_request:
    branches: ["neoforge-1.21.1"]
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a pre-release if every gate passes"
        type: boolean
        default: false
      promote:
        description: "Promote this pre-release tag to a full Release (no gates run)"
        type: string
        default: ""
      played_by:
        description: "With promote: GitHub login of the person who played the build (required)"
        type: string
        default: ""
      played_notes:
        description: "With promote: optional one line on what was played or tested"
        type: string
        default: ""
      publish:
        description: "Publish this already-promoted Release to Modrinth/CurseForge (no gates run)"
        type: string
        default: ""
      publish_setup:
        description: "Create the Modrinth draft project from .github/port-publish.json (once)"
        type: boolean
        default: false
      from_run:
        description: "With release: release the jars and gate logs of this earlier run (a pull_request run of the same tree) instead of building again"
        type: string
        default: ""
      dep_override:
        description: "Dependent gate (never released): owner/repo@tag/asset.jar=G:A:V@sha256 or owner/repo#RUN_ID/ARTIFACT/asset.jar=G:A:V@sha256 ... built and gated against in place of the pinned jar with those coordinates"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gates:
    # Two passes, in parallel. full: every mod the build puts on the game's runtime (the setup the port was
    # developed in). minimal: only what neoforge.mods.toml requires -- optional integrations and dev-only mods
    # removed from the runtime (still compiled against), which is what catches a mod that uses another mod
    # without declaring it. The minimal pass checks FML's own mod list to prove the removal took.
    strategy:
      fail-fast: false
      matrix:
        env: [full, minimal]
    name: gates (${{ matrix.env }})
    if: ${{ github.event_name != 'release' && !inputs.promote && !inputs.publish && !inputs.publish_setup && !inputs.from_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read               # dep_override: a candidate jar in another repository's run artifact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the author's branch is needed: mixins they left unlisted stay exempt
      - name: Port CI kit v7 (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/owner/migrator/releases/download/port-ci-kit-v7/port-ci-kit-v7.tar.gz"
          echo "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Software OpenGL for the client gate
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Dependent gate -- candidate dependency jars instead of the pinned ones (dep_override)
        if: ${{ inputs.dep_override }}
        env:
          DEP_OVERRIDE: ${{ inputs.dep_override }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -f                       # the entries are split on spaces, never globbed
          id='[A-Za-z0-9][A-Za-z0-9_.-]*'
          gav="=([A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*):(${id}):([A-Za-z0-9][A-Za-z0-9_.+-]*)@([0-9a-f]{64})$"
          jar='([A-Za-z0-9][A-Za-z0-9._+-]*\.jar)'
          rel="^(${id}/${id})@([A-Za-z0-9][A-Za-z0-9_.+-]*)/${jar}${gav}"
          art="^(${id}/${id})#([0-9]{1,20})/([A-Za-z0-9._-]+)/${jar}${gav}"
          tmp="$RUNNER_TEMP/dep-override"; mkdir -p "$tmp"
          n=0
          for e in $DEP_OVERRIDE; do
            if [[ "$e" =~ $rel ]]; then
              repo=${BASH_REMATCH[1]}; tag=${BASH_REMATCH[2]}; run=""; an=""; asset=${BASH_REMATCH[3]}
              g=${BASH_REMATCH[4]}; a=${BASH_REMATCH[6]}; v=${BASH_REMATCH[7]}; sha=${BASH_REMATCH[8]}
            elif [[ "$e" =~ $art ]]; then
              repo=${BASH_REMATCH[1]}; tag=""; run=${BASH_REMATCH[2]}; an=${BASH_REMATCH[3]}; asset=${BASH_REMATCH[4]}
              g=${BASH_REMATCH[5]}; a=${BASH_REMATCH[7]}; v=${BASH_REMATCH[8]}; sha=${BASH_REMATCH[9]}
            else
              echo "::error::dep_override: an entry is neither owner/repo@tag/asset.jar=group:artifact:version@sha256 nor owner/repo#RUN_ID/ARTIFACT/asset.jar=group:artifact:version@sha256 (64 lower-case hex)"; exit 1
            fi
            dir="$HOME/.m2/repository/${g//.//}/$a/$v"
            if [ ! -f "$dir/$a-$v.jar" ]; then
              echo "::error::dep_override $g:$a:$v: no pinned dependency jar has these coordinates (it replaces one, never adds one)"; exit 1
            fi
            rm -f "$tmp/candidate.jar"
            if [ -z "$run" ]; then
              url="https://github.com/${repo}/releases/download/${tag}/${asset}"
              curl -fsSL "$url" -o "$tmp/candidate.jar"
              from="$repo@$tag"
            else
              if ! gh api "repos/$repo/actions/runs/$run/artifacts" --paginate --jq '.artifacts[] | [.id, .name, .expired] | @tsv' > "$tmp/artifacts.tsv"; then
                echo "::error::dep_override: the run's token could not read $repo's artifacts (run $run)"; exit 1
              fi
              aid=$(awk -F '\t' -v n="$an" '$2 == n && $3 == "false" { print $1; exit }' "$tmp/artifacts.tsv")
              if [ -z "$aid" ]; then
                echo "::error::dep_override: run $run of $repo has no unexpired artifact named $an"; exit 1
              fi
              if ! gh api "repos/$repo/actions/artifacts/$aid/zip" > "$tmp/artifact.zip"; then
                echo "::error::dep_override: the run's token could not read $repo's artifacts (artifact $an of run $run)"; exit 1
              fi
              if ! python3 -c 'import shutil, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1]); m = [i for i in z.infolist() if i.filename.rsplit("/", 1)[-1] == sys.argv[2]]
          sys.exit(1) if len(m) != 1 else shutil.copyfileobj(z.open(m[0]), open(sys.argv[3], "wb"))' "$tmp/artifact.zip" "$asset" "$tmp/candidate.jar"; then
                echo "::error::dep_override: artifact $an of $repo's run $run holds no single $asset"; exit 1
              fi
              from="$repo run $run artifact $an"
            fi
            echo "$sha  $tmp/candidate.jar" | sha256sum -c -
            mv -f "$tmp/candidate.jar" "$dir/$a-$v.jar"
            [ -f "$dir/$a-$v.pom" ] || echo "<project><modelVersion>4.0.0</modelVersion><groupId>$g</groupId><artifactId>$a</artifactId><version>$v</version><packaging>jar</packaging></project>" > "$dir/$a-$v.pom"
            echo "Dependent gate: $g:$a:$v is $asset from $from (sha256 $sha), not the pinned jar" >> "$GITHUB_STEP_SUMMARY"
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "::error::dep_override names no entry"; exit 1; }
      - name: Build and gates
        run: |
          git rev-parse "HEAD^{tree}" > "$RUNNER_TEMP/built-tree.txt"   # the tree this run built: a from_run release checks it
          git fetch --no-tags origin "master"
          python3 .port-tools/tools/ci-gates.py --repo . --modid "examplemod" --base "origin/master" \
            --gatec "launch,spawn" --env "${{ matrix.env }}" --work-dir "$RUNNER_TEMP/port-ci" --summary "$RUNNER_TEMP/gates.md"
      - name: Gate summary
        if: always()
        run: cat "$RUNNER_TEMP/gates.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-logs-${{ matrix.env }}
          path: |
            ${{ runner.temp }}/port-ci/*.log
            ${{ runner.temp }}/port-ci/*.jsonl
            ${{ runner.temp }}/gates.md
            ${{ runner.temp }}/built-tree.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.env == 'full'
        with:
          name: jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  release:
    # from_run: the gates (and shipped) jobs are skipped and their jars and gate logs come from that earlier run; a
    # skipped job is accepted then only. A run with dep_override is refused below.
    needs: gates
    if: ${{ !cancelled() && github.event_name != 'release' && (startsWith(github.ref, 'refs/tags/') || inputs.release || inputs.from_run) && (needs.gates.result == 'success' || (inputs.from_run && needs.gates.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read               # from_run: the earlier run and its artifacts
    steps:
      - name: Refuse a dependent-gate run
        if: ${{ inputs.dep_override }}
        run: |
          echo "::error::this run built against dep_override's candidate jars, not the pinned ones: it never publishes a release"
          exit 1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false
      - name: Check the earlier run (from_run) built this tree
        if: ${{ inputs.from_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_RUN: ${{ inputs.from_run }}
          RELEASE: ${{ inputs.release && 'yes' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE" ]; then echo "::error::from_run releases an earlier run's jars: dispatch it with release = true"; exit 1; fi
          if ! printf '%s' "$FROM_RUN" | grep -Eq '^[0-9]{1,20}$'; then echo "::error::from_run must be a workflow run id (digits only)"; exit 1; fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN" > "$RUNNER_TEMP/from-run.json"; then
            echo "::error::no workflow run $FROM_RUN in $GITHUB_REPOSITORY: nothing released"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/this-run.json"
          python3 - <<'PY'
          import json, os, re, sys
          t = os.environ["RUNNER_TEMP"]
          r, me = (json.load(open(os.path.join(t, f), encoding="utf-8")) for f in ("from-run.json", "this-run.json"))
          why = ("it is not a run of " + os.environ["GITHUB_REPOSITORY"]
                 if (r.get("repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"] else
                 "it is a run of another workflow" if r.get("workflow_id") != me.get("workflow_id") else
                 "it has not completed" if r.get("status") != "completed" else
                 "it did not succeed (" + str(r.get("conclusion")) + ")" if r.get("conclusion") != "success" else
                 "it was a " + str(r.get("event")) + " run, not a push or pull_request run (which gate the pinned jars)"
                 if r.get("event") not in ("push", "pull_request") else
                 "it names no head commit" if not re.fullmatch(r"[0-9a-f]{40}", str(r.get("head_sha"))) else None)
          if why:
              sys.exit("::error::will not release run " + os.environ["FROM_RUN"] + ": " + why + "; nothing released")
          open(os.path.join(t, "from-run-sha.txt"), "w", encoding="utf-8").write(r["head_sha"] + "\n")
          open(os.path.join(t, "from-run-event.txt"), "w", encoding="utf-8").write(r["event"] + "\n")
          PY
          head=$(cat "$RUNNER_TEMP/from-run-sha.txt")
          if ! git fetch --no-tags -q --depth=1 origin "$head" "$GITHUB_SHA"; then
            echo "::error::cannot fetch run $FROM_RUN's head commit $head: nothing released"; exit 1
          fi
          had=$(git rev-parse "$head^{tree}"); want=$(git rev-parse "$GITHUB_SHA^{tree}")
          if [ "$had" != "$want" ]; then
            echo "::error::run $FROM_RUN tested $head (tree $had), not the tree of $GITHUB_SHA ($want): nothing released; release without from_run"
            exit 1
          fi
          echo "Releasing the jars and gate logs of run $FROM_RUN ($head, the same tree as $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ inputs.from_run && github.token || '' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-logs-*
          path: logs
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ inputs.from_run && github.token || '' }}
      - name: Check the earlier run's gate logs record this tree
        if: ${{ inputs.from_run }}
        env:
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          set -euo pipefail
          want=$(git rev-parse "$GITHUB_SHA^{tree}")
          ls jars/*.jar > /dev/null 2>&1 || { echo "::error::the earlier run left no jars: nothing released"; exit 1; }
          for e in full minimal; do
            [ -f "logs/gate-logs-$e/gates.md" ] || { echo "::error::the earlier run has no gate summary for $e: nothing released"; exit 1; }
          done
          for d in logs/gate-logs-*/; do
            had=$(cat "${d}built-tree.txt" 2>/dev/null || true)
            if [ "$had" != "$want" ]; then
              echo "::error::${d%/} records tree '$had', not this commit's ($want): its gates built something else; nothing released"
              exit 1
            fi
          done
          # the same tree: each summary's first line names this commit (a pull_request run tested GitHub's merge commit,
          # in no branch's history) and says what was tested; every other byte stays as ci-gates.py wrote it
          python3 - <<'PY'
          import os, pathlib, re, sys
          sha, run = os.environ["GITHUB_SHA"], os.environ["FROM_RUN"]
          event = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "from-run-event.txt").read_text(encoding="utf-8").strip()
          for f in sorted(pathlib.Path("logs").glob("gate-logs-*/gates.md")):
              first, nl, rest = f.read_bytes().partition(b"\n")
              cr = b"\r" if first.endswith(b"\r") else b""
              line = first[:len(first) - len(cr)].decode("utf-8")
              m = re.search(r"at `([^`]*)`", line)
              if not line.startswith("Gates for ") or not m:
                  sys.exit("::error::" + f.parent.name + "/gates.md does not start with a gate summary header: nothing released")
              line = (line[:m.start()] + "at `" + sha + "`" + line[m.end():]
                      + " -- tested as " + m.group(1).split(" ")[0] + " (" + event + " run " + run + "), the same tree")
              f.write_bytes(line.encode("utf-8") + cr + nl + rest)
          PY
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          # the commit a tag of this repository points at (an annotated tag peeled), empty when there is no such tag
          tag_commit() { git ls-remote origin "refs/tags/$1" "refs/tags/$1^{}" | awk '{c=$1} END {print c}'; }
          if [ "${{ github.ref_type }}" = tag ]; then TAG="${{ github.ref_name }}"; else
            v=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1)
            TAG="examplemod-${v}-mc1.21.1"
            # the port was fixed but the author's version did not move: release it as -r2, -r3, ... -- a name is taken
            # when its release OR its tag exists (a tag with no release: gh release create would reuse that tag)
            base="$TAG"; n=2
            while [ -n "$(tag_commit "$TAG")" ] || gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; do
              TAG="${base}-r${n}"; n=$((n+1))
            done
          fi
          at=$(tag_commit "$TAG")
          if [ -n "$at" ] && [ "$at" != "${{ github.sha }}" ]; then
            echo "::error::tag $TAG already points at $at, not at ${{ github.sha }} (this build): gh release create would attach the pre-release to $at and ignore --target. Nothing released; delete or move that tag, or bump mod_version"
            exit 1
          fi
          {
            echo "**Unofficial port** of https://github.com/a/examplemod to NeoForge 21.1.100 (Minecraft 1.21.1)."
            echo "Same licence and credits as the original; not an official release by the author."
            echo
            for e in full minimal; do
              cat "logs/gate-logs-$e/gates.md" 2>/dev/null || echo "(gate summary for the $e environment missing)"
              echo
            done
            echo
            echo "Built from \`${{ github.sha }}\` by the author's own Gradle build${FROM_RUN:+ (jars and gates of run $FROM_RUN, the same tree)}. Pre-release until played by a person."
          } > notes.md
          # each environment's gate summary, exactly as ci-gates.py wrote it, as an asset: gate-logs-X/gates.md -> gates-X.md
          mkdir -p gate-assets; gates=()
          for d in logs/gate-logs-*/; do
            [ -f "${d}gates.md" ] || continue
            n=$(basename "$d"); cp "${d}gates.md" "gate-assets/gates-${n#gate-logs-}.md"; gates+=("gate-assets/gates-${n#gate-logs-}.md")
          done
          gh release create "$TAG" jars/*.jar ${gates[@]+"${gates[@]}"} --repo "${{ github.repository }}" --prerelease \
            --title "$TAG (unofficial NeoForge 21.1.100 (Minecraft 1.21.1) port)" --notes-file notes.md --target "${{ github.sha }}"

  promote:
    # A person played this pre-release: make it a full Release. Inputs reach the script only through env, never
    # spliced into it, so a tag or name cannot inject shell.
    if: ${{ inputs.promote }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and history, to prove the tag was built from this branch
      - name: Promote to a full Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.promote }}
          WHO: ${{ inputs.played_by }}
          WHAT: ${{ inputs.played_notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WHO" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$'; then
            echo "::error::played_by must be the GitHub login of the person who played this build"; exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json tagName,isPrerelease,isDraft,author,body > rel.json; then
            echo "::error::no release named $TAG in $GITHUB_REPOSITORY"; exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "::error::$TAG was not built from ${GITHUB_REF_NAME}; promote it from the branch it was built on"; exit 1
          fi
          python3 - <<'PY'
          import datetime, json, os, sys
          r = json.load(open("rel.json"))
          why = ("it is already a full Release" if not r["isPrerelease"] else
                 "it is a draft" if r["isDraft"] else
                 "it was not published by this workflow" if r["author"]["login"] != "github-actions[bot]" else None)
          if why:
              sys.exit(f"::error::will not promote {os.environ['TAG']}: {why}")
          mark = "Pre-release until played by a person."
          if mark not in r["body"]:
              sys.exit(f"::error::{os.environ['TAG']}'s notes lack {mark!r}; not a release this workflow made")
          day = datetime.date.today().isoformat()
          line = f"Played by @{os.environ['WHO']} on {day}"
          what = os.environ["WHAT"].strip().rstrip(".")
          line += (f": {what}." if what else ".") + f" Promoted to a full Release by [this run]({os.environ['RUN_URL']})."
          open("notes.md", "w").write(r["body"].replace(mark, line))
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --notes-file notes.md
          echo "Promoted $TAG (played by @$WHO)" >> "$GITHUB_STEP_SUMMARY"
      # The install manifest (.github/port-install.json, what install-port.py installs) then names the promoted jar and
      # the sibling jars this workflow pins: tools/port-manifest.py refresh, committed as data ([skip ci]) to the port
      # branch only, and only where the branch has a manifest. The commit sits on top of the
      # tag, so publish (needs: promote) still finds the tag in the branch's history. A failure here is reported and
      # never stops publish.
      - name: Port CI kit v7 (pinned by sha256)
        if: ${{ github.ref_name == 'neoforge-1.21.1' && hashFiles('.github/port-install.json') != '' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/owner/migrator/releases/download/port-ci-kit-v7/port-ci-kit-v7.tar.gz"
          echo "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - name: Refresh the install manifest
        if: ${{ github.ref_name == 'neoforge-1.21.1' && hashFiles('.github/port-install.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._+-]+$'; then echo "::error::not a release tag: $TAG"; exit 1; fi
          if [ ! -f .port-tools/tools/port-manifest.py ]; then
            echo "::warning::Port CI kit v7 has no port-manifest.py: regenerate this workflow with a newer kit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do              # the branch can move under us: refresh again on its new tip
            git fetch --no-tags -q origin "neoforge-1.21.1"
            git checkout -q -B "neoforge-1.21.1" FETCH_HEAD
            python3 .port-tools/tools/port-manifest.py refresh --repo . --tag "$TAG" --commit
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then exit 0; fi
            if git push -q origin "HEAD:refs/heads/neoforge-1.21.1"; then
              echo "Install manifest refreshed for $TAG" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          done
          echo "::error::could not push the refreshed install manifest to neoforge-1.21.1"; exit 1

  publish:
    # Upload a promoted Release to Modrinth and CurseForge. needs: promote, so a Claude- or CLI-driven promote
    # publishes in the same run; also a release promoted in the GitHub UI, or publish = <tag> by hand.
    needs: promote
    if: ${{ always() && (needs.promote.result == 'success' || github.event_name == 'release' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write             # appends the Modrinth/CurseForge links to the release notes
      issues: read                # reads the fix ledgers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "neoforge-1.21.1"
          fetch-depth: 0          # tags and history, to prove the tag was built from this branch
      - name: Port CI kit v7 (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/owner/migrator/releases/download/port-ci-kit-v7/port-ci-kit-v7.tar.gz"
          echo "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - name: Publish to Modrinth and CurseForge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          TAG: ${{ inputs.promote || inputs.publish || github.event.release.tag_name }}
          MANUAL: ${{ inputs.publish && 'yes' || '' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._+-]+$'; then echo "::error::not a release tag: $TAG"; exit 1; fi
          python3 .port-tools/tools/port-publish.py publish --repo . --tag "$TAG" ${MANUAL:+--manual}

  publish-setup:
    if: ${{ inputs.publish_setup }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "neoforge-1.21.1"
      - name: Port CI kit v7 (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/owner/migrator/releases/download/port-ci-kit-v7/port-ci-kit-v7.tar.gz"
          echo "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - name: Create the Modrinth draft project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .port-tools/tools/port-publish.py modrinth-create --repo .
