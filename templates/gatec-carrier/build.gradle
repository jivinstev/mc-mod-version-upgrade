// Gate C carrier for Minecraft @MINECRAFT@ (NeoForge @NEOFORGE@): generated by tools/gatec-carrier.py, do not edit here.
//
// The carrier is templates/smoke-harness's client driver (mod id smokeharness) built as a jar a player's real NeoForge
// install loads: the same JVM properties, the same SMOKEHARNESS_BOOT_TEST markers, for every Minecraft version in
// templates/fork-layer/versions.json. Its sources are the smoke harness's, renamed for this version by the gate
// harness rename tables (templates/upstream-harness/versions) plus the carrier's own rows (templates/gatec-carrier/versions).
//
//   ./gradlew build                                    -> build/libs/gatec-carrier-@MINECRAFT@.jar
//   ./gradlew runClient -Psmokeharness.boottest=true -Psmokeharness.testmode=launch   (a dev client, for checking)
//   ./gradlew runClient -Psmokeharness.boottest=true -Psmokeharness.testmode=playtest -Psmokeharness.playtest=/abs/x.playtest
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '@MDG@'
}

version = mod_version
group = 'com.forgeupgrade.smokeharness'
base { archivesName = "gatec-carrier-${minecraft_version}" }

def javaMajor = java_version as int
java.toolchain.languageVersion = JavaLanguageVersion.of(javaMajor)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaMajor
    options.compilerArgs << '-Xlint:none'
}

repositories {
    // JEI's API, compile-only: the probe opens JEI's recipe GUI only when JEI is installed beside the carrier
    maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            // -Psmokeharness.<key>=<value> -> -Dsmokeharness.<key>=<value>, the carrier's whole interface
            ['boottest', 'testmode', 'namespaces', 'battlecount', 'battleticks', 'jeirecipes', 'jeiverify',
             'playtest', 'playtest.out', 'playtest.world'].each { k ->
                if (project.hasProperty("smokeharness.${k}")) {
                    systemProperty "smokeharness.${k}", project.property("smokeharness.${k}").toString()
                }
            }
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }
    mods {
        smokeharness { sourceSet sourceSets.main }
    }
}
if (project.findProperty('nfrt_version')) {
    neoFormRuntime.version = project.property('nfrt_version').toString()
}

dependencies {
    if (project.findProperty('jei_version')) {
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    def props = [mod_version: mod_version, minecraft_range: minecraft_range, neoforge_range: neoforge_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
    archiveFileName = "gatec-carrier-${minecraft_version}.jar"
    manifest {
        attributes('Implementation-Title': 'smokeharness (Gate C carrier)', 'Implementation-Version': mod_version,
                   'Minecraft-Version': minecraft_version, 'NeoForge-Version': neo_version)
    }
}
