# One file per Minecraft target, named versions/<target>.properties, selected with -Pmc=<target>.
# build.gradle loads the named file into `ext` and NEVER branches on the version itself, so a
# third target is a new file here plus a rename table plus an overlay dir -- no build logic.
#
# ---- versions/1.21.1.properties (the CANONICAL dialect: src/main/java is written against it)
# minecraft_version=1.21.1
# minecraft_version_range=[1.21.1,1.21.2)
# neo_version=21.1.228
# java_version=21
# geckolib_version=4.8.4
# overlay=mc21
# geckolib_source=maven
#
# ---- versions/26.2.properties
# minecraft_version=26.2
# minecraft_version_range=[26.2,26.3)
# neo_version=26.2.0.75
# java_version=25                 # MC 26.x needs JDK 25 (catalog V1)
# geckolib_version=5.5.4
# overlay=mc26
# geckolib_source=local           # not on the cloudsmith maven for 26.2 (catalog V10)
# gametest_adapter=on             # 26.x has no @GameTest annotation (catalog V5/V20).
#                                 # A SWITCH, not a namespace: the adapter takes the id from
#                                 # mod_id, because a second copy of it can disagree -- and a
#                                 # wrong one registers the tests under a namespace nobody
#                                 # enables, which Gate B reports as a clean pass over nothing.
