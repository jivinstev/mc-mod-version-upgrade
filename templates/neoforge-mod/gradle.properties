# ─────────────────────────────────────────────────────────────────────────────
# NeoForge 1.21.1 mod-migration workspace — template gradle.properties
# The migrate-mod skill copies this template into mods/<modid>/ and fills these in.
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Target platform (the thing we migrate TO)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.228
loader_version_range=[1,)

# Parchment adds human-readable parameter names on top of Mojang mappings.
# Hugely helpful when reading decompiled sources. Matched to 1.21.1.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# ── Per-mod identity (FILL THESE IN per migrated mod) ────────────────────────
mod_id=examplemod
mod_name=Example Mod
mod_version=0.0.0
mod_group_id=com.example.examplemod
mod_license=All Rights Reserved
mod_authors=unknown
mod_description=A migrated mod.

# ── Optional capabilities the migrated mod may need (toggled by the skill) ────
# Set to true in a mod's own gradle.properties to enable. See build.gradle.
uses_mixins=false
uses_jarjar=false
uses_geckolib=false
geckolib_version=4.8.4
