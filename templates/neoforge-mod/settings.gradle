pluginManagement {
    // NeoForge's own maven FIRST: Maven Central (behind the plugin portal too) rate-limits cloud and CI
    // machines with HTTP 429, so nothing Central does not have to serve should be asked of it
    // (catalogue §V9; on a rate-limited machine also install tools/central-mirror.init.gradle).
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net' }
        mavenCentral()
        // Parchment mappings
        maven { url = 'https://maven.parchmentmc.org' }
        // Common third-party library mods (GeckoLib, JEI, etc.) — harmless if unused
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { name = 'Kotlin for Forge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    }
}

rootProject.name = 'MOD_ID_PLACEHOLDER'
