# Access-transformer lines this version's shared helpers need. tools/fork-port.py adds every line a target's shared
# libraries carry (its inherits chain and any shared_chain=) to that target's accesstransformer.cfg in its stage step,
# so a direct jump that never had this version's target still gets them. A line whose comment says
# `until <version>` reaches targets up to that version only (a class a later Minecraft removed).
public net.minecraft.client.renderer.CompiledShaderProgram <init>(I)V # fork layer: @MVPKG@.ShaderInstance extends it (the class is gone from 1.21.5: until 1.21.4)
