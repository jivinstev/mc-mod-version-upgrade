// Multi-version layer for a community fork port (mc-mod-version-upgrade: templates/fork-layer).
//
// Applied by ONE line, last in the authors' build.gradle, on the fork's `neoforge-1.21.x` branch only.
// Without -Pmc (or with -Pmc=<base version>) this script returns before touching anything, so the base
// build is byte-for-byte the authors' build; CI checks that by building the jar both ways.
//
// With -Pmc=<target> it adjusts the authors' build after the fact, never by editing it:
//   * Java sources go through .multiversion/tools/layer.py prepare: the target's rename table and its
//     whole-file overlays (targets/<t>/java), chained through each target's `inherits`.
//   * targets/<t>/resources is layered over src/main/resources (an overlay file wins).
//   * The access transformer, if the target has one, replaces the authors' (it must be re-derived per
//     Minecraft version: vanilla moves the classes it names).
//   * The Java toolchain, neoforge.mods.toml version ranges and dependency substitutions follow the
//     target's target.properties.
//   * Everything builds into build/mc<t>/, so one target's classes never mix with another's, and the client runs in
//     build/mc<t>/run, so one target's mod configs never reach another's client.
//     The jars it writes to libs carry the target in their name (-mc<t>), so a release can hold one per target.
// Versions are NOT changed here: run through .multiversion/build.sh <t>, which passes the target's
// versions as -P (they override gradle.properties) along with -Pmc.

def mvTarget = project.findProperty('mc')?.toString()
def mvBase = new Properties()
file('.multiversion/base.properties').withInputStream { mvBase.load(it) }
if (mvTarget == null || mvTarget == mvBase.getProperty('minecraft_version')) {
    return
}

def mvDir = file(".multiversion/targets/${mvTarget}")
if (!file("${mvDir}/target.properties").exists()) {
    def known = file('.multiversion/targets').list()?.sort()?.join(', ')
    throw new GradleException("Unknown -Pmc=${mvTarget}. Known targets: ${mvBase.getProperty('minecraft_version')} (base), ${known}")
}
def mvProps = new Properties()
file("${mvDir}/target.properties").withInputStream { mvProps.load(it) }

// The versions must have arrived as -P. Building 1.21.1's Minecraft with a 1.21.4 source tree would
// compile against the wrong game and say nothing.
mvProps.stringPropertyNames().findAll { it.startsWith('prop.') }.each { k ->
    def name = k.substring(5)
    def want = mvProps.getProperty(k)
    if (project.findProperty(name)?.toString() != want) {
        throw new GradleException("-Pmc=${mvTarget} needs -P${name}=${want} (got ${project.findProperty(name)}). " +
                "Build with: .multiversion/build.sh ${mvTarget} <tasks>")
    }
}

def mvPython = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
layout.buildDirectory = file("build/mc${mvTarget}")   // inside build/: every authors' .gitignore ignores it

// ---- the client's game directory ---------------------------------------------------------------------------------
// One per target (issue #114): build/mc<t>/run. Mods write their configs into the game directory in the format of the
// version that ran last, so with one shared run/ a newer target's mod config (a toggle written as the string "ON")
// crashed an older target's client reading it as a boolean -- a Gate C red on a port whose code was not involved.
// The client's only: the gates' GameTest server keeps the harness's own run directory. Without -Pmc this script
// returned above, so a single-version build (and the base) keeps the authors' run directory exactly as it was.
// BEGIN-RUN-DIRS (tools/test-port-tools.sh runs this block)
if (extensions.findByName('neoForge') != null) {
    neoForge.runs.matching { it.name == 'client' }.configureEach { r -> r.gameDirectory = file("build/mc${mvTarget}/run") }
}
// END-RUN-DIRS

// ---- sources -----------------------------------------------------------------------------------
// Every source set's own src/<set>/java goes through the same table (a mod can have more than main: an extra
// variant built against main's classes). Main is prepared last so it can report dead rules over all of them.
// Only the authors' src/<set>/java is swapped: anything else on a set (a gate harness's GameTests wired in by an
// init script, say) stays as it is -- it is written for every target.
def mvOtherSets = []
sourceSets.each { ss ->
    def authors = file("src/${ss.name}/java")
    if (ss.name == 'main' || !authors.isDirectory() || !ss.java.srcDirs.contains(authors)) return
    def prepared = layout.buildDirectory.dir("mv/${ss.name}-java")
    def task = tasks.register("mvPrepare${ss.name.capitalize()}Sources", Exec) {
        description = "Prepare src/${ss.name}/java for Minecraft ${mvTarget}"
        inputs.dir(authors)
        inputs.dir('.multiversion')
        outputs.dir(prepared)
        commandLine mvPython, '.multiversion/tools/layer.py', 'prepare', '--target', mvTarget, '--set', ss.name,
                '--src', authors.path, '--out', prepared.get().asFile.path
    }
    ss.java.srcDirs = ss.java.srcDirs.collect { it == authors ? prepared : it }
    tasks.named(ss.compileJavaTaskName) { dependsOn task }
    mvOtherSets << task
}
def mvPrepared = layout.buildDirectory.dir('mv/java')
def mvPrepare = tasks.register('mvPrepareSources', Exec) {
    description = "Prepare src/main/java for Minecraft ${mvTarget}"
    dependsOn mvOtherSets
    inputs.dir('src/main/java')
    inputs.dir('.multiversion')
    outputs.dir(mvPrepared)
    commandLine mvPython, '.multiversion/tools/layer.py', 'prepare', '--target', mvTarget,
            '--src', 'src/main/java', '--out', mvPrepared.get().asFile.path
}
def mvAuthorsJava = file('src/main/java')
sourceSets.main.java.srcDirs = sourceSets.main.java.srcDirs.collect { it == mvAuthorsJava ? mvPrepared : it }
tasks.named('compileJava') { dependsOn mvPrepare }

// ---- resources ---------------------------------------------------------------------------------
def mvChain = []
for (def t = mvTarget; t; ) {
    mvChain.add(0, t)
    def p = new Properties()
    file(".multiversion/targets/${t}/target.properties").withInputStream { p.load(it) }
    t = p.getProperty('inherits')
}
def mvResDirs = mvChain.reverse().collect { file(".multiversion/targets/${it}/resources") }.findAll { it.isDirectory() }
sourceSets.main.resources.srcDirs = mvResDirs + sourceSets.main.resources.srcDirs.toList()
tasks.withType(ProcessResources).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

def mvAt = mvChain.reverse().collect { file(".multiversion/targets/${it}/resources/META-INF/accesstransformer.cfg") }.find { it.exists() }
if (mvAt != null) {
    neoForge.accessTransformers.files.setFrom(mvAt)
}
// nfrt_version=<v>: the NeoForm runtime that stages this target's Minecraft. Absent (every 1.21.x target): the one the
// authors' ModDevGradle brings. Measured: MDG 2.0.146's NFRT 2.0.27 cannot stage NeoForge 26.2.0.90 (its own access
// transformer widens HolderSet$Named.contents() and the recompile fails on an anonymous subclass); NFRT 2.0.31 (what
// MDG 2.0.148 brings) stages it. Setting it here keeps the authors' plugins block untouched.
if (mvProps.getProperty('nfrt_version')) {
    neoFormRuntime.version = mvProps.getProperty('nfrt_version')      // a project extension of ModDevGradle's, not on neoForge
}

def mvRanges = mvProps.stringPropertyNames().findAll { it.startsWith('toml.') }.collectEntries { [(it.substring(5)): mvProps.getProperty(it)] }
// BEGIN-MIXINS (tools/test-port-tools.sh runs this block; `.multiversion/tools/layer.py mixins` resolves the same set)
// mixin_add.<config file>=<array>:<Class>,<Class>;<array>:<Class> -- mixins that exist only on this target (and
// those it inherits), added to the authors' config at processResources so the config itself is never copied.
// mixin_add_only.<config file>=... and mixin_remove_only.<config file>=... (same form) apply to THIS target alone,
// after the inherited mixin_add chain: a target that inherits this one gets neither. For a hook that only this
// version's method shape takes. layer.py leaves such a class out of every other target's prepared tree (the one that
// compiles and that the mixin audit reads), and a mixin_remove_only class out of this target's. A mixin_remove_only
// naming a class the config does not list stops the build: a typo must not leave the mixin on in silence.
def mvMixinAdds = [:]
def mvMixinRemoves = [:]
def mvMixinPut = { Map into, String cfg, String value ->
    value.split(';').each { spec ->
        def (array, classes) = spec.split(':', 2) as List
        classes.split(',').each { c -> ((into[cfg] ?: (into[cfg] = [:]))[array.trim()] ?: (into[cfg][array.trim()] = [])).add(c.trim()) }
    }
}
mvChain.each { t ->
    def p = new Properties()
    file(".multiversion/targets/${t}/target.properties").withInputStream { p.load(it) }
    p.stringPropertyNames().findAll { it.startsWith('mixin_add.') }.each { k ->
        mvMixinPut(mvMixinAdds, k.substring('mixin_add.'.length()), p.getProperty(k))
    }
    if (t == mvTarget) {           // the chain is farthest first, so these come after every inherited mixin_add
        p.stringPropertyNames().findAll { it.startsWith('mixin_add_only.') }.each { k ->
            mvMixinPut(mvMixinAdds, k.substring('mixin_add_only.'.length()), p.getProperty(k))
        }
        p.stringPropertyNames().findAll { it.startsWith('mixin_remove_only.') }.each { k ->
            mvMixinPut(mvMixinRemoves, k.substring('mixin_remove_only.'.length()), p.getProperty(k))
        }
    }
}
tasks.withType(ProcessResources).configureEach {
    inputs.property('mvRanges', mvRanges.toString())
    inputs.property('mvMixinAdds', mvMixinAdds.toString())
    if (mvMixinRemoves) {
        inputs.property('mvMixinRemoves', mvMixinRemoves.toString())
    }
    doLast {
        destinationDir.eachFileRecurse { f ->
            if (f.name == 'neoforge.mods.toml') {
                f.text = mvRewriteToml(f.text, mvRanges)
            }
            def adds = mvMixinAdds[f.name]
            def removes = mvMixinRemoves[f.name]
            if (adds || removes) {
                def json = new groovy.json.JsonSlurper().parseText(f.getText('UTF-8'))
                adds?.each { array, classes ->
                    def list = (json[array] ?: []) as List
                    classes.each { c -> if (!list.contains(c)) list.add(c) }
                    json[array] = list
                }
                removes?.each { array, classes ->
                    def list = (json[array] ?: []) as List
                    classes.each { c ->
                        if (!list.removeAll([c])) {
                            throw new GradleException("target.properties of ${mvTarget}: mixin_remove_only.${f.name} names ${array}:${c}, which ${f.name} does not list")
                        }
                    }
                    json[array] = list
                }
                f.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
            }
        }
    }
}
// END-MIXINS

// ---- toolchain and dependencies ----------------------------------------------------------------
if (mvProps.getProperty('java_version')) {
    def jv = mvProps.getProperty('java_version') as int
    java.toolchain.languageVersion = JavaLanguageVersion.of(jv)
    tasks.withType(JavaCompile).configureEach { options.release = jv }
}
def mvSubs = mvProps.stringPropertyNames().findAll { it.startsWith('substitute.') }
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        mvSubs.each { k -> substitute(module(k.substring(11))).using(module(mvProps.getProperty(k))) }
    }
}
// tools/layer-deps.py: a dependency with no build for this Minecraft that the port does not require is taken off
// the classpath (exclude.<group:module>=<reason>), and a build it found on Modrinth needs Modrinth's maven.
// BEGIN-EXCLUDES (tools/test-port-tools.sh runs this block)
mvProps.stringPropertyNames().findAll { it.startsWith('exclude.') }.each { k ->
    def ga = k.substring(8).split(':', 2)
    // a key with no ':' (an unescaped one is cut there by java.util.Properties) would exclude a WHOLE group
    if (ga.length != 2 || !ga[0] || !ga[1]) {
        throw new GradleException("target.properties: ${k} is not exclude.<group>\\:<module> (escape the ':')")
    }
    configurations.configureEach { exclude group: ga[0], module: ga[1] }
}
// END-EXCLUDES
if (mvSubs.any { mvProps.getProperty(it).startsWith('maven.modrinth:') }) {
    repositories {
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    }
}
// ---- jar names ---------------------------------------------------------------------------------
// Every target writes into its own build/mc<t>/libs, so the jars never clash on disk -- but they would all carry
// the SAME file name, and a name is what a release asset, a Modrinth/CurseForge file and a player's mods/ folder
// know them by. So the jars a player can pick up (those written to the libs directory) get "-mc<target>" before
// the extension: examplemod-1.1.9_mr.jar -> examplemod-1.1.9_mr-mc1.21.4.jar. Only with -Pmc (this script
// returned above otherwise), so the base build's jars are byte-for-byte what they were. Jars written elsewhere
// (a helper embedded into another jar by file name) keep their names: the mod finds them by name.
// BEGIN-JAR-NAMES
tasks.withType(Jar).configureEach { jarTask ->
    if (jarTask.destinationDirectory.get().asFile != base.libsDirectory.get().asFile) return
    // read now: a property cannot be set to a provider derived from itself (Gradle: circular evaluation)
    jarTask.archiveFileName.set(mvJarName(jarTask.archiveFileName.get(), mvTarget))
}
String mvJarName(String name, String target) {
    def suffix = "-mc${target}"
    if (!name.endsWith('.jar') || name.endsWith("${suffix}.jar")) return name
    return name.substring(0, name.length() - 4) + suffix + '.jar'
}
// END-JAR-NAMES
println "multiversion: target ${mvTarget} (chain ${mvChain.join(' > ')}), build dir build/mc${mvTarget}"

// Replace versionRange in the [[dependencies.*]] block whose modId the key names ("minecraft", "neoforge").
String mvRewriteToml(String text, Map ranges) {
    def out = new StringBuilder()
    String modId = null
    text.eachLine { line ->
        def m = line =~ /^\s*modId\s*=\s*"([^"]+)"/
        if (line.trim().startsWith('[')) modId = null
        if (m.find()) modId = m.group(1)
        def v = line =~ /^(\s*versionRange\s*=\s*)"[^"]*"(.*)$/
        if (modId != null && ranges.containsKey(modId) && v.find()) {
            line = "${v.group(1)}\"${ranges[modId]}\"${v.group(2)}"
        }
        out.append(line).append('\n')
    }
    return out.toString()
}
