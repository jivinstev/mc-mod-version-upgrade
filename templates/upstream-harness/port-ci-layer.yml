
  # ---- Multi-version layer jobs (tools/layer-ci.py). Installed with --layer-branch {{LAYER_BRANCH}}; they run only on
  # that branch (and on pull requests into it), and only where .multiversion/ exists, so the port branch's own
  # jobs above behave exactly as without a layer. On {{BRANCH}} every job below is skipped.
  #   layer-plan       which targets exist: the newest (by version, 1.21.11 > 1.21.8) and the middle ones
  #   layer-isolation  the branch differs from {{BRANCH}} only in .multiversion/ and the one commented hook line
  #   layer-inertness  the authors' jars are entry-for-entry identical with and without that hook line
  #   layer-compile    each MIDDLE target: every source set compiles, the mixin and event-listener audits are clean
  #   layer-gates      the NEWEST target: all gates, Gate C included, plus the shipped jar when the fork records one
  # The {{BRANCH}} gates above also run on the layer branch: they are its 1.21.1 bookend.
  layer-plan:
    name: layer plan
    if: ${{ (github.ref_name == '{{LAYER_BRANCH}}' || github.base_ref == '{{LAYER_BRANCH}}') && github.event_name != 'release' && !inputs.promote && !inputs.publish && !inputs.publish_setup }}
    runs-on: ubuntu-24.04
    outputs:
      layer: ${{ steps.plan.outputs.layer }}
      newest: ${{ steps.plan.outputs.newest }}
      newest_java: ${{ steps.plan.outputs.newest_java }}
      has_middle: ${{ steps.plan.outputs.has_middle }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shipped: ${{ steps.plan.outputs.shipped }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the layer's jobs
        id: plan
        run: |
          if [ ! -f .multiversion/base.properties ]; then
            echo "no .multiversion/ in this checkout: the layer jobs are skipped"
            echo "layer=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/{{MIGRATOR_REPO}}/releases/download/port-ci-kit-v{{KIT_VERSION}}/port-ci-kit-v{{KIT_VERSION}}.tar.gz"
          echo "{{KIT_SHA256}}  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
          python3 .port-tools/tools/layer-ci.py plan --repo . --github-output "$GITHUB_OUTPUT"

  layer-isolation:
    name: layer isolation (only .multiversion/ and the hook differ from {{BRANCH}})
    needs: layer-plan
    if: ${{ needs.layer-plan.outputs.layer == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolation against origin/{{BRANCH}}
        run: |
          git fetch --no-tags origin "{{BRANCH}}"
          python3 .multiversion/tools/layer.py isolation --base "origin/{{BRANCH}}"

  layer-inertness:
    name: layer inertness (the hook changes no jar)
    needs: layer-plan
    if: ${{ needs.layer-plan.outputs.layer == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Port CI kit v{{KIT_VERSION}} (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/{{MIGRATOR_REPO}}/releases/download/port-ci-kit-v{{KIT_VERSION}}/port-ci-kit-v{{KIT_VERSION}}.tar.gz"
          echo "{{KIT_SHA256}}  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{JAVA}}"
{{PRE_BUILD}}
      - name: Build the jars with and without the hook line, compare them
        run: python3 .port-tools/tools/layer-ci.py inertness --repo . --work "$RUNNER_TEMP/inertness"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-inertness
          path: ${{ runner.temp }}/inertness/*.log
          if-no-files-found: ignore

  layer-compile:
    # Compile-only: a change on {{BRANCH}} that breaks one middle target's overlay shows here, in minutes, without
    # booting Minecraft once per target. The newest target gets the full gates in layer-gates.
    name: layer compile (${{ matrix.t }})
    needs: layer-plan
    if: ${{ needs.layer-plan.outputs.layer == 'true' && needs.layer-plan.outputs.has_middle == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.layer-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Port CI kit v{{KIT_VERSION}} (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/{{MIGRATOR_REPO}}/releases/download/port-ci-kit-v{{KIT_VERSION}}/port-ci-kit-v{{KIT_VERSION}}.tar.gz"
          echo "{{KIT_SHA256}}  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
{{PRE_BUILD}}
      - name: Compile every source set, then the mixin and event-listener audits
        env:
          TARGET: ${{ matrix.t }}
        run: python3 .port-tools/tools/layer-ci.py compile --repo . --mc "$TARGET" --work "$RUNNER_TEMP/layer-$TARGET" --summary "$RUNNER_TEMP/layer-$TARGET.md"
      - name: Summary
        if: always()
        env:
          TARGET: ${{ matrix.t }}
        run: cat "$RUNNER_TEMP/layer-$TARGET.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-compile-${{ matrix.t }}
          path: |
            ${{ runner.temp }}/layer-${{ matrix.t }}/*.log
            ${{ runner.temp }}/layer-${{ matrix.t }}.md
          if-no-files-found: ignore

  layer-gates:
    name: layer gates (newest target ${{ needs.layer-plan.outputs.newest }})
    needs: layer-plan
    if: ${{ needs.layer-plan.outputs.layer == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the author's branch is needed: mixins they left unlisted stay exempt
      - name: Port CI kit v{{KIT_VERSION}} (pinned by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kit.tar.gz" \
            "https://github.com/{{MIGRATOR_REPO}}/releases/download/port-ci-kit-v{{KIT_VERSION}}/port-ci-kit-v{{KIT_VERSION}}.tar.gz"
          echo "{{KIT_SHA256}}  $RUNNER_TEMP/kit.tar.gz" | sha256sum -c -
          mkdir -p .port-tools && tar -xzf "$RUNNER_TEMP/kit.tar.gz" -C .port-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.layer-plan.outputs.newest_java }}
      - name: Software OpenGL for the client gate
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
{{PRE_BUILD}}
      - name: All gates on the newest target
        env:
          NEWEST: ${{ needs.layer-plan.outputs.newest }}
          SHIPPED: ${{ needs.layer-plan.outputs.shipped }}
        run: |
          git fetch --no-tags origin "{{BASE}}"
          extra=""; [ "$SHIPPED" = true ] && extra="--shipped"
          python3 .port-tools/tools/ci-gates.py --repo . --modid "{{MODID}}" --base "origin/{{BASE}}" --mc "$NEWEST" $extra \
            --gatec "{{GATEC}}" --work-dir "$RUNNER_TEMP/layer-gates" --summary "$RUNNER_TEMP/layer-gates.md"
      - name: Gate summary
        if: always()
        run: cat "$RUNNER_TEMP/layer-gates.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-gates-${{ needs.layer-plan.outputs.newest }}
          path: |
            ${{ runner.temp }}/layer-gates/*.log
            ${{ runner.temp }}/layer-gates/*.jsonl
            ${{ runner.temp }}/layer-gates/shipped/**
            ${{ runner.temp }}/layer-gates.md
          if-no-files-found: ignore
