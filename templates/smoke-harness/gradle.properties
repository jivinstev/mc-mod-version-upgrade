# ─────────────────────────────────────────────────────────────────────────────
# NeoForge 1.21.1 SMOKE-HARNESS workspace — gradle.properties
#
# This is NOT a mod-migration workspace. It's a throwaway host whose only job is to
# boot ARBITRARY prebuilt mod jars (passed via -Psmokejars) inside an isolated run/
# dir and prove they load (headless server) and render (client). The install-mod
# skill copies this whole folder to a temp location and drives it. See build.gradle.
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Target platform (the thing we migrate TO)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.228
loader_version_range=[1,)

# Parchment adds human-readable parameter names on top of Mojang mappings.
# Hugely helpful when reading decompiled sources. Matched to 1.21.1.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# ── Harness identity (fixed — the harness owns this throwaway modid) ──────────
mod_id=smokeharness
mod_name=Smoke Harness
mod_version=1.0.0
mod_group_id=com.forgeupgrade.smokeharness
mod_license=All Rights Reserved
mod_authors=minecraft-forge-upgrade
mod_description=Throwaway host that boots arbitrary prebuilt mod jars for smoke-testing.

# ── Optional capabilities the migrated mod may need (toggled by the skill) ────
# Set to true in a mod's own gradle.properties to enable. See build.gradle.
uses_mixins=false
uses_jarjar=false
uses_geckolib=false
geckolib_version=4.8.4
