# The gates that stand between this repository and publishing somebody else's work.
#
# These run in CI rather than only as a local hook, because a hook is a courtesy the author can skip
# and CI is the thing branch protection can require. Both are wired: the hook catches the mistake
# before it leaves the machine, this catches it if the hook was bypassed.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-ip:
    name: no third-party IP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check scans the COMMITTED TREE, not the diff -- a file added in an earlier commit
          # and pushed later is still a publication. Depth 1 is therefore enough and correct.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ONE step, and the shell decides — NOT two steps gated on `if: secrets.X != ''`.
      # The `secrets` context is NOT available in an `if:` conditional, and using it there is a
      # workflow-FILE error: the first push failed in 0s with zero jobs run and the only clue was
      # "this run likely failed because of a workflow file issue". A secret reaches a step through
      # `env`, and shell tests the env var.
      #
      # An OPTIONAL private list of mod names can arrive as the FORBIDDEN_MOD_NAMES secret, so this
      # public repo never contains the names it checks for. Without it every other check still runs;
      # mod names are refused at the source (propose-learnings refuses the port's own identity) and by
      # the reviewer's reading. With it, --strict makes an unreadable list a FAILURE, not a silent pass.
      - name: check-no-ip
        env:
          NAMES: ${{ secrets.FORBIDDEN_MOD_NAMES }}
        run: |
          if [ -n "$NAMES" ]; then
            printf '%s\n' "$NAMES" > "$RUNNER_TEMP/forbidden-names.txt"
            python3 tools/check-no-ip.py --names "$RUNNER_TEMP/forbidden-names.txt" --strict
          else
            echo "note: no FORBIDDEN_MOD_NAMES secret (optional); the other checks all run."
            python3 tools/check-no-ip.py
          fi

  gates-self-test:
    name: the gates themselves still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # check-no-ip.py is code in this repo checking content in this repo, so "it says PASS" is weak
      # evidence by itself. This plants a violation of every kind and requires the gate to FAIL on
      # each -- the only thing that distinguishes a working gate from one that always says yes.
      - run: ./tools/test-gates.sh

  catalog-fidelity:
    name: no lost migration rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # On a PR, judge its catalogue against the BASE branch's census, not the one it ships: a PR that
      # deletes an entry and its census row together would otherwise pass the gate it just edited.
      - name: use the base branch's census
        if: github.event_name == 'pull_request'
        run: git show "origin/${{ github.base_ref }}:docs/catalog-census.tsv" > docs/catalog-census.tsv
      - run: python3 tools/check-catalog-fidelity.py

  vendored-licence:
    name: vendored files match the licence manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # VENDORED.tsv is the licence boundary: every file a scaffolder copies into a user's project.
      # It is DERIVED from the scaffolders' own copy commands, so this fails if the copy set moved and
      # the manifest did not, if a vendored file lost its SPDX header, or if a non-vendored file
      # claims the vendored licence.
      - run: python3 tools/gen-vendored.py --check

  setup-self-test:
    name: setup keeps its promises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Idempotence (a second --yes run changes nothing), hand edits winning, the install path
      # completing with NO Java on PATH, additive path switches, explicit removal, backups.
      - run: ./tools/test-setup.sh
      - run: python3 tools/mod-registry/test_providers.py
      # The README's cloud steps are copies of cloud/; fail if they drift.
      - run: python3 cloud/check_readme.py

  renames-self-test:
    name: rename-table generators and composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Composition keeps hand rows authoritative and inside the exempt block; the colour rule
      # reads fields and record components from real compiled classes (stubs built on the fly).
      - run: ./tools/test-renames.sh

  cycle-self-test:
    name: port lifecycle (finish-port, propose-learnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The port lands in the destination and never here; a lesson reaches the catalogue only
      # through the gates, and never names the mod it came from.
      - run: ./tools/test-cycle.sh


  review:
    name: contribution review (security, weakened gates, catalogue form)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The mechanical half of tools/review-pr.py; the review-contribution skill does the rest. The
      # self-tests have their own jobs, so they are skipped here, except that a CHANGED self-test is
      # still run on base and head to catch one that now asserts less.
      - name: review-pr
        env:
          NAMES: ${{ secrets.FORBIDDEN_MOD_NAMES }}
        run: |
          args="--base origin/${{ github.base_ref }} --head HEAD --skip-self-tests"
          if [ -n "$NAMES" ]; then
            printf '%s\n' "$NAMES" > "$RUNNER_TEMP/forbidden-names.txt"
            args="$args --names $RUNNER_TEMP/forbidden-names.txt"
          fi
          git config --global user.name ci; git config --global user.email ci@example.invalid
          python3 tools/review-pr.py $args

  review-self-test:
    name: the reviewer catches what it claims to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Nine planted bad PRs (a leaked name, a jar, curl|sh, a symptom-less entry, a deleted rule, a
      # rule deleted with its census row, a widened allowlist, a CI step that cannot fail, a weakened
      # self-test) must each be blocked, and a clean control must pass.
      - run: ./tools/test-review.sh

  port-tools-self-test:
    name: port tools (override probe, sweep runner, resource test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The probe finds methods that compile but override nothing; the sweep must be valid shell; the
      # resource test is compiled against stub JUnit and must catch each data-layer failure it names.
      - run: ./tools/test-port-tools.sh
